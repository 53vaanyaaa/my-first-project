<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR-код · Золотое сечение в AR</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vmin;background:#fff;color:#111;font-family:-apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;text-align:center;padding:3vmin;box-sizing:border-box}
  h1{margin:0;font-size:4.6vmin} p{margin:0;font-size:3.2vmin;color:#444}
  #qr{width:min(52vmin,90vw);height:min(52vmin,90vw)} #qr svg{width:100%;height:100%;display:block}
  #url{font-size:3vmin;font-weight:600;word-break:break-all;background:#f1f1f1;border-radius:2vmin;padding:1.2vmin 2.4vmin}
  .steps{font-size:3vmin;color:#333;max-width:90vw}
  button{font-size:2.6vmin;padding:1.2vmin 2.6vmin;border-radius:2vmin;border:1px solid #aaa;background:#fff}
  @media print{button{display:none}}
</style></head><body>
<h1>🌻🌲🐚 Золотое сечение в AR</h1>
<p>Наведи камеру телефона на код и открой ссылку</p>
<div id="qr"></div>
<div id="url"></div>
<div class="steps">iPhone: нажми на картинку → «AR» → наведи на стол · Android: Chrome → «Поставить на стол»</div>
<button onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()">На весь экран</button>
<script src="steam-fibonacci/lib/qrcode.js"></script>
<script>
  // адрес сайта = эта страница без «qr.html» (или ?u=свой_адрес)
  var q = new URLSearchParams(location.search).get('u');
  var url = q || location.href.replace(/qr\.html.*$/, '');
  var qr = qrcode(0, 'M'); qr.addData(url); qr.make();
  document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 10, margin: 4, scalable: true });
  document.getElementById('url').textContent = url;
</script>
</body></html>
