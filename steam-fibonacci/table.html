<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>STEAM · Фибоначчи на столе (AR)</title>
<style>
  html,body{margin:0;height:100%;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  #start button{font-size:20px;padding:16px 28px;border:0;border-radius:16px;background:#ffd54a;color:#1b1500;font-weight:700}
  #start p{max-width:340px;opacity:.85;line-height:1.4;margin:0}
  #msg{color:#ff9a8a}
  #ov{display:none;position:fixed;inset:0;pointer-events:none}
  #ov *{pointer-events:auto}
  #hint{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:16px;text-shadow:0 1px 6px #000;pointer-events:none}
  #bottom{position:absolute;left:0;right:0;bottom:0;padding:8px 10px 14px;background:linear-gradient(#0000,#000b 40%)}
  #info{background:#0b1230e6;border:1px solid #ffffff2a;border-radius:14px;padding:10px 14px;margin-bottom:8px;font-size:13.5px;line-height:1.4;max-height:30vh;overflow:auto}
  #info h2{margin:0 0 4px;font-size:16px} #info p{margin:0}
  #tabs{display:flex;gap:8px}
  .tab,.sm{border:1px solid #fff4;background:#1a2447;color:#fff;border-radius:14px;padding:11px 4px;font-size:15px;font-weight:600}
  .tab{flex:1} .tab.on{background:#ffd54a;color:#1b1500;border-color:#ffd54a}
  .sm{padding:8px 12px;font-size:13px;margin-right:6px;margin-bottom:8px}
</style>
<script src="lib/aframe.min.js"></script>
<script src="app.js"></script>
</head>
<body>
<div id="start">
  <h1 style="margin:0">🪵 Фибоначчи на столе</h1>
  <p>Нажми кнопку, наведи камеру на стол и медленно поводи телефоном, пока не появится кольцо. Тапни, и модель встанет на столешницу.</p>
  <button id="go">Начать AR</button>
  <p id="msg"></p>
  <p><a href="index.html" style="color:#ffd54a">← режим с маркером (iPhone и др.)</a></p>
</div>
<div id="ov">
  <div id="hint">Води телефоном над столом…</div>
  <div id="bottom">
    <div><button class="sm" id="bLab">Подписи ✓</button><button class="sm" id="bMove">Переставить</button><button class="sm" id="bExit">Выход</button></div>
    <div id="info"></div>
    <div id="tabs"><button class="tab" data-i="0">🌻 Подсолнух</button><button class="tab" data-i="1">🌲 Шишка</button><button class="tab" data-i="2">🐚 Наутилус</button></div>
  </div>
</div>
<script>
(function () {
  var THREE = AFRAME.THREE, M = window.FIBMODELS;
  var msg = document.getElementById('msg'), ov = document.getElementById('ov'), hint = document.getElementById('hint');
  function fail(t) { msg.textContent = t; }
  if (!navigator.xr || !navigator.xr.isSessionSupported) { fail('Этот браузер не умеет AR-плоскости. Нужен Chrome на Android (с ARCore). На iPhone используй режим с маркером.'); }
  else navigator.xr.isSessionSupported('immersive-ar').then(function (ok) { if (!ok) fail('AR недоступен на этом устройстве/браузере. На iPhone используй режим с маркером.'); });

  var renderer, scene, camera, reticle, holder, models, cur = 0, labelsOn = true, placed = false, moving = true;
  var hitSource = null, session = null;

  function show(i) {
    cur = i; models.forEach(function (m, k) { m.visible = k === i; });
    document.querySelectorAll('.tab').forEach(function (b, k) { b.classList.toggle('on', k === i); });
    document.getElementById('info').innerHTML = '<h2>' + M.INFO[i].icon + ' ' + M.INFO[i].name + '</h2><p>' + M.INFO[i].html + '</p>';
    setLabels(labelsOn);
  }
  function setLabels(on) { labelsOn = on; models.forEach(function (m) { (m.userData.labelList || []).forEach(function (s) { s.visible = on; }); }); }

  function init() {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true; renderer.xr.setReferenceSpaceType('local');
    document.body.appendChild(renderer.domElement);
    scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.02, 20);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x888899, 1.1));
    var d = new THREE.DirectionalLight(0xffffff, 0.9); d.position.set(1, 3, 2); scene.add(d);
    reticle = new THREE.Mesh(new THREE.RingGeometry(0.07, 0.09, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffd54a }));
    reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);
    holder = new THREE.Group(); holder.visible = false; holder.scale.setScalar(0.3); scene.add(holder);   // модель ≈ 30 см
    models = M.builders.map(function (b) { var m = b(); holder.add(m); return m; });
    show(0);
    renderer.setAnimationLoop(function (t, frame) {
      if (frame && hitSource && moving) {
        var r = frame.getHitTestResults(hitSource);
        if (r.length) { var pose = r[0].getPose(renderer.xr.getReferenceSpace()); reticle.visible = true; reticle.matrix.fromArray(pose.transform.matrix); hint.textContent = placed ? 'Тапни, чтобы переставить' : 'Тапни, чтобы поставить модель'; }
        else { reticle.visible = false; hint.textContent = 'Води телефоном над столом…'; }
      }
      if (holder.visible) models[cur].rotation.y += 0.004;
      renderer.render(scene, camera);
    });
  }

  document.getElementById('go').addEventListener('click', function () {
    navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay'], domOverlay: { root: ov } }).then(function (s) {
      session = s; if (!renderer) init();
      renderer.xr.setSession(s);
      s.requestReferenceSpace('viewer').then(function (vs) { s.requestHitTestSource({ space: vs }).then(function (src) { hitSource = src; }); });
      ov.style.display = 'block'; document.getElementById('start').style.display = 'none';
      s.addEventListener('select', function () {
        if (!moving || !reticle.visible) return;
        holder.position.setFromMatrixPosition(reticle.matrix); holder.visible = true; placed = true; moving = false; reticle.visible = false; hint.textContent = '';
      });
      s.addEventListener('end', function () { hitSource = null; ov.style.display = 'none'; document.getElementById('start').style.display = ''; });
    }).catch(function (e) { fail('Не удалось запустить AR: ' + e.message); });
  });
  ['bottom'].forEach(function (id) { document.getElementById(id).addEventListener('beforexrselect', function (e) { e.preventDefault(); }); });
  document.querySelectorAll('.tab').forEach(function (b) { b.addEventListener('click', function () { show(+b.dataset.i); }); });
  document.getElementById('bLab').addEventListener('click', function () { setLabels(!labelsOn); this.textContent = 'Подписи ' + (labelsOn ? '✓' : '✗'); });
  document.getElementById('bMove').addEventListener('click', function () { moving = true; });
  document.getElementById('bExit').addEventListener('click', function () { if (session) session.end(); });
})();
</script>
</body>
</html>
