<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Маркер для печати (A4)</title>
<style>
  @page{size:A4;margin:0}
  html,body{margin:0;background:#fff;font-family:system-ui,Arial,sans-serif;color:#111}
  .page{width:210mm;height:297mm;box-sizing:border-box;padding:18mm 15mm;text-align:center;position:relative}
  h1{font-size:22pt;margin:0 0 4mm} p{font-size:12pt;margin:2mm 0}
  img{width:150mm;height:150mm;display:block;margin:12mm auto 8mm;image-rendering:pixelated}
  .note{font-size:10pt;color:#555;position:absolute;left:15mm;right:15mm;bottom:14mm}
  @media screen{body{background:#ddd}.page{margin:10px auto;background:#fff}}
</style></head><body>
<div class="page">
  <h1>AR · маркер</h1>
  <p>Напечатай эту страницу на A4 <b>без полей, масштаб 100%</b>.</p>
  <p>Положи лист на стол, открой приложение и наведи камеру на чёрный квадрат.</p>
  <img src="data/hiro.png" alt="маркер">
  <p><b>🌻 подсолнух · 🌲 шишка · 🐚 наутилус</b></p>
  <div class="note">Не загибай лист и не закрывай чёрную рамку пальцами. Свет должен быть ровный, без бликов.</div>
</div>
</body></html>
